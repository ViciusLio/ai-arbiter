name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored anywhere.
#
# The release is triggered by the project owner pushing a version tag, and publication
# waits for approval if the `pypi` environment has required reviewers.
# One-time setup and the release steps are in docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
      - run: uv build
      - name: The wheel installs and runs on its own
        run: |
          uv venv /tmp/release-check
          uv pip install --python /tmp/release-check/bin/python dist/*.whl
          cd "$(mktemp -d)"
          /tmp/release-check/bin/arbiter --version
          /tmp/release-check/bin/arbiter init
      # As a user installs it: the wheel with its extras, in a clean environment, running
      # the demonstrations. `0.1.0a1` was published without this, and its install
      # instructions were found broken by hand afterwards.
      - name: The wheel with its extras runs the demonstrations
        run: |
          uv venv /tmp/release-extras
          uv pip install --python /tmp/release-extras/bin/python "$(ls dist/*.whl)[gateway,mcp,a2a]"
          cd "$(mktemp -d)"
          /tmp/release-extras/bin/arbiter init
          /tmp/release-extras/bin/arbiter demo tour
          /tmp/release-extras/bin/arbiter demo tour --case consulting
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/ai-arbiter/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
