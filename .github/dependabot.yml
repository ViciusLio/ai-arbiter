version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /deploy/docker
      - /deploy/compose
    schedule:
      interval: weekly
    commit-message:
      prefix: build
