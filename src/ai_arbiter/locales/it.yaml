aia.art26_1_instructions_for_use: "Adottare misure tecniche e organizzative per utilizzare il sistema conformemente alle istruzioni per l'uso."
aia.art26_2_human_oversight: "Affidare la sorveglianza umana a persone fisiche che dispongono della competenza, della formazione, dell'autorità e del sostegno necessari."
aia.art26_4_input_data: "Se l'organizzazione esercita il controllo sui dati di input, garantire che siano pertinenti e sufficientemente rappresentativi rispetto alla finalità prevista."
aia.art26_5_monitoring: "Monitorare il funzionamento del sistema sulla base delle istruzioni per l'uso; informare il fornitore e le autorità in caso di rischi e incidenti gravi e sospendere l'uso quando emerge un rischio."
aia.art26_6_logs: "Conservare i log generati automaticamente dal sistema, nella misura in cui sono sotto il controllo dell'organizzazione, per almeno sei mesi, salvo diversa disposizione di altre norme."
aia.art26_7_inform_workers: "Prima di utilizzare il sistema sul luogo di lavoro, informare i rappresentanti dei lavoratori e i lavoratori interessati."
aia.art26_8_registration: "Rispettare gli obblighi di registrazione dell'articolo 49 e non utilizzare un sistema non registrato nella banca dati dell'UE."
aia.art26_9_dpia: "Se del caso, usare le informazioni fornite dal fornitore per effettuare la valutazione d'impatto sulla protezione dei dati."
aia.art27_fundamental_rights_assessment: "Prima di utilizzare un sistema ad alto rischio elencato nell'allegato III, effettuare una valutazione dell'impatto sui diritti fondamentali."

# Regole di scansione: che cosa dice un rilievo.
scan.system_not_classified: "Il sistema è dichiarato e non è stato classificato."
scan.classification_undetermined: "La classificazione è indeterminata: mancano fatti che potrebbero cambiarla."
scan.classification_not_reviewed: "La classificazione è indicativa: nessuno l'ha confermata o corretta."
scan.prohibited_practice: "Il sistema è classificato come pratica vietata e non è dismesso."
scan.derogation_without_assessment: "È dichiarata la deroga dell'articolo 6, paragrafo 3, e non è registrato alcun riferimento alla valutazione documentata del fornitore."
scan.transparency_notice_not_attested: "Si applica un obbligo di trasparenza rivolto al deployer e non è attestata alcuna informativa alle persone interessate."
scan.human_oversight_not_attested: "Il sistema è ad alto rischio e non è attestata l'assegnazione della sorveglianza umana."
scan.undeclared_model_in_traffic: "Il traffico del sistema ha raggiunto un modello che la sua dichiarazione non elenca."
scan.personal_data_not_declared: "I rilevatori hanno trovato dati personali nei prompt di un sistema che non è dichiarato come trattamento di dati personali."
scan.retired_system_in_use: "Il sistema è dichiarato come dismesso e genera ancora traffico."
scan.system_without_owner: "Per il sistema non è indicato alcun responsabile."
scan.role_not_covered: "L'organizzazione ricopre per questo sistema un ruolo i cui obblighi non sono valutati da questa versione."
scan.unattributed_traffic: "Sono passate dal gateway richieste con chiavi API non collegate ad alcun sistema dichiarato."

