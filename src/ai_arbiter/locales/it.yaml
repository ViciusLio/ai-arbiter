# Pack AI Act: domande poste su un sistema. Sintesi, non il testo normativo.
fact.scope.is_ai_system: "È un sistema di IA: un sistema automatizzato che deduce dall'input come generare output quali previsioni, contenuti, raccomandazioni o decisioni."
fact.scope.union_nexus: "L'organizzazione è stabilita o situata nell'Unione, oppure l'output del sistema è utilizzato nell'Unione."
fact.scope.military_defence_national_security: "È utilizzato esclusivamente per scopi militari, di difesa o di sicurezza nazionale."
fact.scope.scientific_research_only: "È stato specificamente sviluppato e messo in servizio al solo scopo di ricerca e sviluppo scientifici."
fact.scope.pre_market_development: "È ancora in fase di ricerca, prova o sviluppo e non è stato immesso sul mercato né messo in servizio (le prove in condizioni reali non rientrano)."
fact.scope.personal_non_professional: "È utilizzato da una persona fisica nel corso di un'attività non professionale puramente personale."
fact.prohibited.manipulative_techniques: "Utilizza tecniche subliminali o volutamente manipolative o ingannevoli che distorcono materialmente il comportamento di una persona e provocano o possono provocare un danno significativo."
fact.prohibited.exploits_vulnerabilities: "Sfrutta le vulnerabilità di persone dovute all'età, alla disabilità o a una specifica situazione sociale o economica, distorcendone il comportamento in modo che provochi o possa provocare un danno significativo."
fact.prohibited.intimate_content_without_consent: "È utilizzato per generare o manipolare immagini, video o audio realistici delle parti intime di una persona identificabile o di sue attività sessualmente esplicite senza il suo consenso esplicito."
fact.prohibited.child_sexual_abuse_material: "È utilizzato per generare o manipolare materiale pedopornografico ai sensi della direttiva 2011/93/UE."
fact.prohibited.social_scoring: "Valuta o classifica le persone nel tempo sulla base del comportamento sociale o di caratteristiche personali, con un punteggio sociale che comporta un trattamento pregiudizievole in contesti non collegati oppure ingiustificato o sproporzionato."
fact.prohibited.crime_prediction_by_profiling: "Valuta o prevede il rischio che una persona fisica commetta un reato unicamente sulla base della profilazione o dei tratti della personalità (non a sostegno di una valutazione umana già fondata su fatti oggettivi e verificabili)."
fact.prohibited.facial_image_scraping: "Crea o amplia banche dati di riconoscimento facciale mediante scraping non mirato di immagini facciali da internet o da filmati di telecamere a circuito chiuso."
fact.prohibited.emotion_inference_work_education: "Inferisce le emozioni di persone fisiche nell'ambito del luogo di lavoro o degli istituti di istruzione."
fact.prohibited.emotion_inference_medical_or_safety: "Tale inferenza delle emozioni è adottata per motivi medici o di sicurezza."
fact.prohibited.biometric_categorisation_sensitive: "Classifica individualmente le persone sulla base dei dati biometrici per dedurne razza, opinioni politiche, appartenenza sindacale, convinzioni religiose o filosofiche, vita sessuale o orientamento sessuale."
fact.prohibited.realtime_remote_biometric_identification: "È utilizzato per l'identificazione biometrica remota «in tempo reale» in spazi accessibili al pubblico a fini di attività di contrasto."
fact.prohibited.realtime_rbi_authorised_objective: "Tale uso è strettamente necessario per uno degli obiettivi elencati all'articolo 5, paragrafo 1, lettera h), punti da i) a iii), ed è autorizzato come richiede l'articolo 5."
fact.high_risk.annex1_safety_component: "È un componente di sicurezza di un prodotto, o è esso stesso un prodotto, disciplinato dalla normativa di armonizzazione dell'Unione elencata nell'allegato I (un sistema usato solo per assistenza, ottimizzazione o comodità non legate alla sicurezza non è un componente di sicurezza)."
fact.high_risk.annex1_third_party_assessment: "Tale prodotto è soggetto a una valutazione della conformità da parte di terzi ai sensi di tale normativa, per rischi per la salute e la sicurezza."
fact.annex3.biometrics: "È utilizzato nel settore della biometria."
fact.annex3.biometrics_remote_identification: "È un sistema di identificazione biometrica remota (non una verifica biometrica la cui unica finalità è confermare che una persona è chi dice di essere)."
fact.annex3.biometrics_categorisation: "È destinato alla categorizzazione biometrica in base ad attributi o caratteristiche sensibili o protetti, basata sulla deduzione di tali attributi."
fact.annex3.biometrics_emotion_recognition: "È destinato a essere utilizzato per il riconoscimento delle emozioni."
fact.annex3.critical_infrastructure: "È un componente di sicurezza nella gestione e nel funzionamento delle infrastrutture digitali critiche, del traffico stradale o nella fornitura di acqua, gas, riscaldamento o elettricità."
fact.annex3.education: "È utilizzato nell'istruzione o nella formazione professionale."
fact.annex3.education_admission: "Determina l'accesso, l'ammissione o l'assegnazione di persone agli istituti di istruzione e formazione professionale."
fact.annex3.education_learning_outcomes: "Valuta i risultati dell'apprendimento, anche quando sono usati per orientare il processo di apprendimento."
fact.annex3.education_level_assessment: "Valuta il livello di istruzione adeguato che una persona riceverà o a cui potrà accedere."
fact.annex3.education_exam_monitoring: "Monitora e rileva comportamenti vietati degli studenti durante le prove."
fact.annex3.employment: "È utilizzato nell'occupazione, nella gestione dei lavoratori o nell'accesso al lavoro autonomo."
fact.annex3.employment_recruitment: "È utilizzato per l'assunzione o la selezione di persone: annunci di lavoro mirati, analisi e filtro delle candidature, valutazione dei candidati."
fact.annex3.employment_work_decisions: "Adotta decisioni riguardanti i rapporti di lavoro, la promozione o la cessazione, assegna compiti in base al comportamento individuale o a tratti personali, oppure monitora e valuta prestazioni e comportamento."
fact.annex3.essential_services: "È utilizzato per l'accesso a servizi privati essenziali o a prestazioni e servizi pubblici essenziali."
fact.annex3.essential_public_benefits: "È utilizzato dalle autorità pubbliche o per loro conto per valutare l'ammissibilità a prestazioni e servizi di assistenza pubblica essenziali, o per concederli, ridurli, revocarli o recuperarli."
fact.annex3.essential_creditworthiness: "Valuta l'affidabilità creditizia delle persone fisiche o ne stabilisce il merito di credito (non per individuare frodi finanziarie)."
fact.annex3.essential_insurance_pricing: "È utilizzato per la valutazione dei rischi e la determinazione dei prezzi in relazione a persone fisiche per assicurazioni sulla vita e sanitarie."
fact.annex3.essential_emergency_dispatch: "Valuta e classifica le chiamate di emergenza, invia servizi di emergenza o ne stabilisce le priorità, oppure seleziona i pazienti dell'assistenza sanitaria di emergenza."
fact.annex3.law_enforcement: "È utilizzato dalle autorità di contrasto o per loro conto."
fact.annex3.law_enforcement_victim_risk: "Determina il rischio per una persona fisica di diventare vittima di reati."
fact.annex3.law_enforcement_polygraph: "È utilizzato come poligrafo o strumento analogo."
fact.annex3.law_enforcement_evidence_reliability: "Valuta l'affidabilità degli elementi probatori nelle indagini o nel perseguimento di reati."
fact.annex3.law_enforcement_offending_risk: "Determina il rischio di reato o recidiva di una persona non solo sulla base della profilazione, o valuta tratti della personalità o precedenti comportamenti criminali."
fact.annex3.law_enforcement_profiling: "È utilizzato per la profilazione delle persone fisiche nell'accertamento, nell'indagine o nel perseguimento di reati."
fact.annex3.migration: "È utilizzato nella gestione della migrazione, dell'asilo o del controllo delle frontiere dalle autorità pubbliche competenti o per loro conto."
fact.annex3.migration_polygraph: "È utilizzato come poligrafo o strumento analogo."
fact.annex3.migration_risk_assessment: "Valuta un rischio (per la sicurezza, di migrazione irregolare, per la salute) posto da una persona che intende entrare o è entrata in uno Stato membro."
fact.annex3.migration_application_examination: "Assiste nell'esame delle domande di asilo, di visto o di permesso di soggiorno e dei relativi reclami."
fact.annex3.migration_identification: "Individua, riconosce o identifica persone fisiche in tale contesto (non la verifica dei documenti di viaggio)."
fact.annex3.justice: "È utilizzato nell'amministrazione della giustizia o nei processi democratici."
fact.annex3.justice_judicial_assistance: "Assiste un'autorità giudiziaria nella ricerca e nell'interpretazione dei fatti e del diritto e nell'applicazione della legge ai fatti, o è usato in modo analogo nella risoluzione alternativa delle controversie."
fact.annex3.justice_election_influence: "È utilizzato per influenzare l'esito di un'elezione o di un referendum o il comportamento di voto delle persone (non strumenti ai quali le persone non sono direttamente esposte, come la logistica delle campagne)."
fact.high_risk.derogation_claimed: "Il fornitore ha concluso che il sistema non è ad alto rischio a norma dell'articolo 6, paragrafo 3, perché non presenta un rischio significativo di danno."
fact.high_risk.profiling_natural_persons: "Il sistema effettua profilazione di persone fisiche."
fact.high_risk.derogation_assessment_ref: "Riferimento alla valutazione documentata del fornitore (identificativo o collocazione del documento)."
fact.transparency.interacts_with_persons: "È destinato a interagire direttamente con le persone fisiche."
fact.transparency.generates_synthetic_content: "Genera contenuti audio, immagine, video o testuali sintetici."
fact.transparency.emotion_or_biometric_categorisation: "È un sistema di riconoscimento delle emozioni o di categorizzazione biometrica."
fact.transparency.deep_fake: "Genera o manipola immagini o contenuti audio o video che costituiscono un «deep fake»."
fact.transparency.public_interest_text: "Genera o manipola testo pubblicato allo scopo di informare il pubblico su questioni di interesse pubblico."
fact.transparency.editorial_control: "Tale testo è sottoposto a revisione umana o a controllo editoriale e una persona detiene la responsabilità editoriale della pubblicazione."
fact.deployer.public_authority: "L'organizzazione è un'autorità pubblica o un'istituzione, un organo o un organismo dell'Unione."
fact.deployer.public_law_body_or_public_service: "L'organizzazione è un organismo di diritto pubblico o un ente privato che fornisce servizi pubblici."
fact.deployer.employer_uses_at_workplace: "L'organizzazione è un datore di lavoro e utilizza il sistema sul luogo di lavoro."

# Pack AI Act: esiti e obblighi.
aia.art3_not_an_ai_system: "Non è un sistema di IA ai sensi dell'articolo 3, punto 1: il regolamento non si applica."
aia.art2_1_no_union_nexus: "L'organizzazione non è nell'Unione e l'output non è utilizzato nell'Unione: fuori dall'ambito dell'articolo 2, paragrafo 1."
aia.art2_3_military: "Utilizzato esclusivamente per scopi militari, di difesa o di sicurezza nazionale: escluso dall'articolo 2, paragrafo 3."
aia.art2_6_research: "Sviluppato e messo in servizio al solo scopo di ricerca e sviluppo scientifici: escluso dall'articolo 2, paragrafo 6."
aia.art2_8_pre_market: "Attività di ricerca, prova o sviluppo prima dell'immissione sul mercato o della messa in servizio: esclusa dall'articolo 2, paragrafo 8."
aia.art2_10_personal_use: "Utilizzato da una persona fisica in un'attività non professionale puramente personale: gli obblighi dei deployer non si applicano (articolo 2, paragrafo 10)."
aia.art4_ai_literacy: "Adottare misure per sostenere lo sviluppo dell'alfabetizzazione in materia di IA del personale e delle altre persone che operano e usano il sistema per conto dell'organizzazione."
aia.art5_1a_manipulation: "Pratica vietata: tecniche subliminali, manipolative o ingannevoli che provocano un danno significativo."
aia.art5_1b_vulnerabilities: "Pratica vietata: sfruttamento delle vulnerabilità dovute all'età, alla disabilità o alla situazione sociale o economica."
aia.art5_1ba_intimate_content: "Pratica vietata: generazione o manipolazione di materiale intimo o sessualmente esplicito di una persona identificabile senza consenso."
aia.art5_1bb_csam: "Pratica vietata: generazione o manipolazione di materiale pedopornografico."
aia.art5_1c_social_scoring: "Pratica vietata: punteggio sociale che comporta un trattamento pregiudizievole o sproporzionato."
aia.art5_1d_crime_prediction: "Pratica vietata: previsione del rischio che una persona commetta un reato unicamente sulla base della profilazione o dei tratti della personalità."
aia.art5_1e_facial_scraping: "Pratica vietata: banche dati di riconoscimento facciale create mediante scraping non mirato."
aia.art5_1f_emotion_inference: "Pratica vietata: inferenza delle emozioni sul luogo di lavoro o negli istituti di istruzione, al di fuori di motivi medici o di sicurezza."
aia.art5_1g_biometric_categorisation: "Pratica vietata: categorizzazione biometrica per dedurre caratteristiche sensibili."
aia.art5_1h_realtime_rbi: "Pratica vietata: identificazione biometrica remota «in tempo reale» in spazi accessibili al pubblico a fini di attività di contrasto, al di fuori degli obiettivi elencati."
aia.art6_1_annex1_product: "Alto rischio: componente di sicurezza di un prodotto disciplinato dall'allegato I soggetto a valutazione della conformità da parte di terzi."
aia.art6_3_derogation: "Trattato come non ad alto rischio in base alla deroga dell'articolo 6, paragrafo 3, dichiarata dal fornitore. Conservare la valutazione documentata del fornitore; il fornitore registra il sistema (articolo 49, paragrafo 2)."
aia.art50_1_interaction: "Le persone che interagiscono con il sistema sono informate del fatto di stare interagendo con un sistema di IA, a meno che ciò non risulti evidente."
aia.art50_2_synthetic_content: "Gli output sono marcati in un formato leggibile meccanicamente e rilevabili come generati o manipolati artificialmente. I sistemi immessi sul mercato prima del 2 agosto 2026 hanno tempo fino al 2 dicembre 2026."
aia.art50_3_emotion_biometric: "Informare le persone fisiche esposte a un sistema di riconoscimento delle emozioni o di categorizzazione biometrica in merito al suo funzionamento."
aia.art50_4_deep_fake: "Rendere noto che il contenuto «deep fake» è stato generato o manipolato artificialmente."
aia.art50_4_public_interest_text: "Rendere noto che il testo pubblicato per informare il pubblico su questioni di interesse pubblico è stato generato o manipolato artificialmente."
aia.annex3_1a_remote_biometric_id: "Alto rischio: identificazione biometrica remota (allegato III(1)(a))."
aia.annex3_1b_biometric_categorisation: "Alto rischio: categorizzazione biometrica in base ad attributi sensibili (allegato III(1)(b))."
aia.annex3_1c_emotion_recognition: "Alto rischio: riconoscimento delle emozioni (allegato III(1)(c))."
aia.annex3_2_critical_infrastructure: "Alto rischio: componente di sicurezza di infrastrutture critiche (allegato III(2))."
aia.annex3_3a_education_admission: "Alto rischio: accesso o ammissione all'istruzione e alla formazione professionale (allegato III(3)(a))."
aia.annex3_3b_learning_outcomes: "Alto rischio: valutazione dei risultati dell'apprendimento (allegato III(3)(b))."
aia.annex3_3c_education_level: "Alto rischio: valutazione del livello di istruzione adeguato (allegato III(3)(c))."
aia.annex3_3d_exam_monitoring: "Alto rischio: monitoraggio degli studenti durante le prove (allegato III(3)(d))."
aia.annex3_4a_recruitment: "Alto rischio: assunzione o selezione di persone (allegato III(4)(a))."
aia.annex3_4b_work_decisions: "Alto rischio: decisioni sui rapporti di lavoro, assegnazione dei compiti, monitoraggio e valutazione dei lavoratori (allegato III(4)(b))."
aia.annex3_5a_public_benefits: "Alto rischio: ammissibilità a prestazioni e servizi di assistenza pubblica essenziali (allegato III(5)(a))."
aia.annex3_5b_creditworthiness: "Alto rischio: affidabilità creditizia o merito di credito delle persone fisiche (allegato III(5)(b))."
aia.annex3_5c_insurance_pricing: "Alto rischio: valutazione dei rischi e determinazione dei prezzi per assicurazioni sulla vita e sanitarie (allegato III(5)(c))."
aia.annex3_5d_emergency_dispatch: "Alto rischio: chiamate di emergenza, invio dei servizi e selezione dei pazienti (allegato III(5)(d))."
aia.annex3_6a_victim_risk: "Alto rischio: rischio di diventare vittima di reati (allegato III(6)(a))."
aia.annex3_6b_polygraph: "Alto rischio: poligrafi e strumenti analoghi nelle attività di contrasto (allegato III(6)(b))."
aia.annex3_6c_evidence_reliability: "Alto rischio: affidabilità degli elementi probatori (allegato III(6)(c))."
aia.annex3_6d_offending_risk: "Alto rischio: rischio di reato o recidiva (allegato III(6)(d))."
aia.annex3_6e_profiling: "Alto rischio: profilazione nell'accertamento, nell'indagine o nel perseguimento di reati (allegato III(6)(e))."
aia.annex3_7a_polygraph: "Alto rischio: poligrafi e strumenti analoghi in materia di migrazione, asilo e controllo delle frontiere (allegato III(7)(a))."
aia.annex3_7b_migration_risk: "Alto rischio: valutazione del rischio posto da persone che entrano in uno Stato membro (allegato III(7)(b))."
aia.annex3_7c_application_examination: "Alto rischio: esame delle domande di asilo, di visto e di permesso di soggiorno (allegato III(7)(c))."
aia.annex3_7d_identification: "Alto rischio: individuazione, riconoscimento o identificazione di persone nella gestione della migrazione e delle frontiere (allegato III(7)(d))."
aia.annex3_8a_judicial_assistance: "Alto rischio: assistenza a un'autorità giudiziaria (allegato III(8)(a))."
aia.annex3_8b_election_influence: "Alto rischio: influenza su elezioni, referendum o comportamento di voto (allegato III(8)(b))."
aia.art26_1_instructions_for_use: "Adottare misure tecniche e organizzative per utilizzare il sistema conformemente alle istruzioni per l'uso."
aia.art26_2_human_oversight: "Affidare la sorveglianza umana a persone fisiche che dispongono della competenza, della formazione, dell'autorità e del sostegno necessari."
aia.art26_4_input_data: "Se l'organizzazione esercita il controllo sui dati di input, garantire che siano pertinenti e sufficientemente rappresentativi rispetto alla finalità prevista."
aia.art26_5_monitoring: "Monitorare il funzionamento del sistema sulla base delle istruzioni per l'uso; informare il fornitore e le autorità in caso di rischi e incidenti gravi e sospendere l'uso quando emerge un rischio."
aia.art26_6_logs: "Conservare i log generati automaticamente dal sistema, nella misura in cui sono sotto il controllo dell'organizzazione, per almeno sei mesi, salvo diversa disposizione di altre norme."
aia.art26_7_inform_workers: "Prima di utilizzare il sistema sul luogo di lavoro, informare i rappresentanti dei lavoratori e i lavoratori interessati."
aia.art26_8_registration: "Rispettare gli obblighi di registrazione dell'articolo 49 e non utilizzare un sistema non registrato nella banca dati dell'UE."
aia.art26_9_dpia: "Se del caso, usare le informazioni fornite dal fornitore per effettuare la valutazione d'impatto sulla protezione dei dati."
aia.art27_fundamental_rights_assessment: "Prima di utilizzare un sistema ad alto rischio elencato nell'allegato III, effettuare una valutazione dell'impatto sui diritti fondamentali."

# Regole di scansione: che cosa dice un rilievo.
scan.system_not_classified: "Il sistema è dichiarato e non è stato classificato."
scan.classification_undetermined: "La classificazione è indeterminata: mancano fatti che potrebbero cambiarla."
scan.classification_not_reviewed: "La classificazione è indicativa: nessuno l'ha confermata o corretta."
scan.prohibited_practice: "Il sistema è classificato come pratica vietata e non è dismesso."
scan.derogation_without_assessment: "È dichiarata la deroga dell'articolo 6, paragrafo 3, e non è registrato alcun riferimento alla valutazione documentata del fornitore."
scan.transparency_notice_not_attested: "Si applica un obbligo di trasparenza rivolto al deployer e non è attestata alcuna informativa alle persone interessate."
scan.human_oversight_not_attested: "Il sistema è ad alto rischio e non è attestata l'assegnazione della sorveglianza umana."
scan.undeclared_model_in_traffic: "Il traffico del sistema ha raggiunto un modello che la sua dichiarazione non elenca."
scan.personal_data_not_declared: "I rilevatori hanno trovato dati personali nei prompt di un sistema che non è dichiarato come trattamento di dati personali."
scan.retired_system_in_use: "Il sistema è dichiarato come dismesso e genera ancora traffico."
scan.system_without_owner: "Per il sistema non è indicato alcun responsabile."
