demo.story.cast.elena: "Elena Ferri"
demo.story.cast.elena.role: "Guida il comitato IA. Ha scritto la regola e rivede gli strumenti rischiosi."
demo.story.cast.giulia: "Giulia Conti"
demo.story.cast.giulia.role: "Consulente sulla commessa della banca. Lavora in un ambiente di sviluppo con IA."
demo.story.cast.marco: "Marco Rinaldi"
demo.story.cast.marco.role: "Sviluppatore sulla stessa commessa. Lavora con un assistente di codice."
demo.story.cast.sara: "Sara Vitale"
demo.story.cast.sara.role: "Selezione del personale. Usa lo screening dei CV."
demo.story.cast.luca: "Luca Moretti"
demo.story.cast.luca.role: "Commerciale. Prepara le offerte con Claude."
demo.story.cast.lab: "Il laboratorio"
demo.story.cast.lab.role: "Un gruppo interno che fa esperimenti."
demo.story.cast.vendor: "Un fornitore"
demo.story.cast.vendor.role: "Ha proposto uno strumento alle risorse umane. Nessuno l'ha comprato."
demo.story.approved_engine.when: "09:10"
demo.story.approved_engine.who: "giulia"
demo.story.approved_engine.text: "Giulia sta cercando un errore nel codice dei bonifici della banca. Per spiegarlo incolla nel suo ambiente di sviluppo un caso reale: l'indirizzo e-mail e l'IBAN di un cliente della banca. Lo strumento è impostato su Claude, il motore approvato."
demo.story.other_engine.when: "09:40"
demo.story.other_engine.who: "giulia"
demo.story.other_engine.text: "Un collega le ha detto che un altro motore è più veloce nel riscrivere il codice. Giulia cambia motore dalle impostazioni dello strumento e riprova. Non sta facendo nulla di strano: lo strumento glielo permette."
demo.story.second_tool.when: "10:15"
demo.story.second_tool.who: "marco"
demo.story.second_tool.text: "Marco lavora sullo stesso progetto con un assistente di codice. Prima chiede a Claude di completare un test; poi, per curiosità, prova lo stesso con un altro motore."
demo.story.credential.when: "11:30"
demo.story.credential.who: "giulia"
demo.story.credential.text: "La pipeline di rilascio si è bloccata. Giulia copia il messaggio di errore così com'è e lo incolla nell'ambiente di sviluppo per farsi aiutare. Dentro c'è un token di accesso al repository della banca."
demo.story.high_risk.when: "14:00"
demo.story.high_risk.who: "sara"
demo.story.high_risk.text: "Sara deve ordinare le candidature per una posizione da analista e apre lo screening dei CV. È uno strumento che incide sulle persone: per l'AI Act è indicativamente ad alto rischio, e la società vuole che qualcuno ne abbia rivisto la classificazione prima dell'uso. Elena, del comitato IA, la rivede e la conferma."
demo.story.prohibited.when: "15:20"
demo.story.prohibited.who: "vendor"
demo.story.prohibited.text: "Un fornitore ha proposto alle risorse umane uno strumento che deduce l'umore dei dipendenti dalle registrazioni delle riunioni. Qualcuno lo collega per una prova. Chiede Claude, il modello approvato."
demo.story.budget.when: "16:00"
demo.story.budget.who: "luca"
demo.story.budget.text: "Luca prepara l'offerta per un cliente della grande distribuzione e si fa aiutare da Claude. La commessa ha un budget mensile per l'IA, concordato con il cliente."
demo.story.tools.when: "16:45"
demo.story.tools.who: "giulia"
demo.story.tools.text: "L'ambiente di sviluppo può anche agire sul repository della banca attraverso un server di strumenti: leggere file, aprire richieste di modifica, cancellare rami. La società gli ha concesso una sola di queste azioni."
demo.story.shadow.when: "17:30"
demo.story.shadow.who: "lab"
demo.story.shadow.text: "Nel laboratorio interno qualcuno sta provando a far ordinare a Claude i ticket di assistenza per urgenza. Usa una chiave del laboratorio: il modello è approvato, ma nessuno ha mai dichiarato questo uso."
demo.story.verdict.allowed: "Passata"
demo.story.verdict.masked: "Passata, con i dati mascherati"
demo.story.verdict.blocked: "Fermata"
demo.story.verdict.both: "In parte passata, in parte fermata"
demo.story.verdict.review: "Fermata, poi passata dopo la revisione"
demo.story.verdict.noted: "Notato e segnalato"
demo.story.title: "Una giornata alla Nordwind"
demo.story.premise: "{firm} è una società di consulenza informatica. Sull'IA ha deciso una cosa sola: le sue persone possono usare Claude, e nient'altro. Però non usano Claude direttamente: usano strumenti, e alcuni di questi possono passare a un altro motore con un clic. Ecco che cosa succede in una giornata qualunque, con Arbiter in mezzo."
demo.story.cast.title: "Chi c'è nella storia"
demo.story.rule.title: "La regola, in una frase"
demo.story.rule.text: "Puoi usare gli strumenti che la società ha dichiarato, e solo con i modelli che ha approvato."
demo.story.rule.more: "Altre due regole della società: uno strumento rischioso aspetta finché una persona non lo ha rivisto, e una password o un token non escono mai dalla società."
demo.story.rule.how: "La regola è un file, versione {version}. Arbiter lo legge e lo applica a ogni richiesta prima che la richiesta esca."
demo.story.inventory.title: "Gli strumenti che la società ha dichiarato"
demo.story.inventory.lead: "Alle 08:30 Elena controlla l'elenco. Per ogni strumento Arbiter propone quanto è rischioso secondo l'AI Act europeo. Una proposta resta una proposta finché una persona non la conferma."
demo.story.scene.does: "Che cosa succede"
demo.story.scene.arbiter: "Che cosa fa Arbiter"
demo.story.scene.rule: "Regola"
demo.story.evening.kicker: "A fine giornata"
demo.story.matrix.title: "La giornata in una tabella"
demo.story.matrix.lead: "Ogni strumento, ogni motore che ha chiesto, e com'è andata. In verde ciò che è passato, in rosso ciò che è stato fermato prima di raggiungere un modello."
demo.story.findings.title: "Che cosa trova Elena sulla scrivania"
demo.story.findings.lead: "Arbiter ha confrontato ciò che la società ha dichiarato con ciò che è successo durante la giornata. Sono proposte: una persona conferma, respinge o accetta ciascuna."
demo.story.findings.more: "E altre {count} note minori, come uno strumento senza un responsabile indicato o una classificazione che nessuno ha ancora confermato."
demo.story.proof.title: "Che cosa resta, e che cosa questa storia non dimostra"
demo.story.proof.lead: "Tutto ciò che è stato deciso oggi è scritto in un registro in cui ogni voce è legata alla precedente: cambiarne una rompe la catena. Ciò che le persone hanno scritto non viene conservato."
demo.story.limits.title: "Detto chiaramente"
demo.story.approved_engine.arbiter: "Lascia passare la domanda, perché Claude è approvato. Ma prima sostituisce con dei segnaposto i dati del cliente della banca ({found}): il modello non li vede mai."
demo.story.other_engine.arbiter: "Ferma la richiesta prima che esca. L'ambiente di sviluppo è uno strumento dichiarato, ma {model} non è tra i modelli approvati. Giulia riceve un messaggio che spiega il motivo."
demo.story.second_tool.arbiter: "Con {allowed} la richiesta passa. Con {denied} viene fermata, esattamente come è successo a Giulia: la regola guarda il modello, non lo strumento."
demo.story.credential.arbiter: "Ferma la richiesta. Un dato personale si può mascherare; per una credenziale la società ha deciso che non deve partire nulla, nemmeno mascherato."
demo.story.high_risk.arbiter: "La prima richiesta di Sara viene fermata: nessuno ha ancora rivisto la classificazione. Dopo la conferma di Elena, la stessa richiesta passa. La revisione resta registrata con chi l'ha fatta."
demo.story.high_risk_repeated.arbiter: "In un'esecuzione precedente Elena aveva già confermato la classificazione, quindi la richiesta di Sara passa. Ripartendo da zero si vede prima il rifiuto."
demo.story.prohibited.arbiter: "Ferma la richiesta, anche se il modello è approvato. Dedurre le emozioni delle persone sul lavoro è una pratica che l'AI Act vieta: a quello strumento non viene dato alcun modello."
demo.story.budget.arbiter: "La prima richiesta passa. Con quella il budget della commessa {project} è esaurito, e la successiva viene fermata finché qualcuno non decide di alzarlo."
demo.story.tools.arbiter: "All'ambiente di sviluppo mostra solo l'azione concessa ({visible}), delle tre che il server offre. Leggere un file riesce; il tentativo di cancellare un ramo viene fermato."
demo.story.shadow.arbiter: "Le richieste passano: il modello è approvato. Ma Arbiter nota che dietro non c'è nessuno strumento dichiarato e lo segnala come possibile sistema da dichiarare: {names}."

