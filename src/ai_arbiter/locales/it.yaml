demo.report.limit.1: "Il modello e il server di strumenti sono sostituti dentro un solo processo. Nessun fornitore vero e nessuno strumento vero è stato chiamato."
demo.report.limit.2: "Gli strumenti hanno nomi generici di proposito. Se un prodotto reale può essere messo dietro un gateway, e quali motori offre, cambia da prodotto a prodotto: lo verifica ogni organizzazione con il fornitore."
demo.report.limit.3: "Arbiter vede ciò che passa da lui. Un servizio aperto nel browser no: leggere i log della rete aziendale è tra i desiderata."
