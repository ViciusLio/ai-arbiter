# AI Act rule pack: questions asked about a system. Summaries, not the legal text.
fact.scope.is_ai_system: "It is an AI system: a machine-based system that infers from its input how to generate outputs such as predictions, content, recommendations or decisions."
fact.scope.union_nexus: "The organisation is established or located in the Union, or the output of the system is used in the Union."
fact.scope.military_defence_national_security: "It is used exclusively for military, defence or national security purposes."
fact.scope.scientific_research_only: "It was specifically developed and put into service for the sole purpose of scientific research and development."
fact.scope.pre_market_development: "It is still in research, testing or development and has not been placed on the market or put into service (testing in real world conditions does not count)."
fact.scope.personal_non_professional: "It is used by a natural person in the course of a purely personal, non-professional activity."
fact.prohibited.manipulative_techniques: "It deploys subliminal, purposefully manipulative or deceptive techniques that materially distort a person's behaviour and cause or are likely to cause significant harm."
fact.prohibited.exploits_vulnerabilities: "It exploits vulnerabilities of persons due to their age, disability or social or economic situation, distorting their behaviour in a way that causes or is likely to cause significant harm."
fact.prohibited.intimate_content_without_consent: "It is used to generate or manipulate realistic images, video or audio of an identifiable person's intimate parts or sexually explicit activities without that person's explicit consent."
fact.prohibited.child_sexual_abuse_material: "It is used to generate or manipulate child sexual abuse material within the meaning of Directive 2011/93/EU."
fact.prohibited.social_scoring: "It evaluates or classifies persons over time based on their social behaviour or personal characteristics, with a social score leading to detrimental treatment in unrelated contexts or that is unjustified or disproportionate."
fact.prohibited.crime_prediction_by_profiling: "It assesses or predicts the risk of a natural person committing a criminal offence based solely on profiling or on personality traits (not to support a human assessment already based on objective, verifiable facts)."
fact.prohibited.facial_image_scraping: "It creates or expands facial recognition databases through untargeted scraping of facial images from the internet or CCTV footage."
fact.prohibited.emotion_inference_work_education: "It infers emotions of natural persons in the workplace or in education institutions."
fact.prohibited.emotion_inference_medical_or_safety: "That inference of emotions is put in place for medical or safety reasons."
fact.prohibited.biometric_categorisation_sensitive: "It categorises persons individually from their biometric data to deduce race, political opinions, trade union membership, religious or philosophical beliefs, sex life or sexual orientation."
fact.prohibited.realtime_remote_biometric_identification: "It is used for 'real-time' remote biometric identification in publicly accessible spaces for the purposes of law enforcement."
fact.prohibited.realtime_rbi_authorised_objective: "That use is strictly necessary for one of the objectives listed in Article 5(1)(h), points (i) to (iii), and authorised as Article 5 requires."
fact.high_risk.annex1_safety_component: "It is a safety component of a product, or is itself a product, covered by the Union harmonisation legislation listed in Annex I (a system used solely for non-safety assistance, optimisation or convenience is not a safety component)."
fact.high_risk.annex1_third_party_assessment: "That product must undergo a third-party conformity assessment under that legislation, for risks to health and safety."
fact.annex3.biometrics: "It is used in the area of biometrics."
fact.annex3.biometrics_remote_identification: "It is a remote biometric identification system (not biometric verification whose sole purpose is to confirm that a person is who they claim to be)."
fact.annex3.biometrics_categorisation: "It is intended for biometric categorisation according to sensitive or protected attributes or characteristics, based on the inference of those attributes."
fact.annex3.biometrics_emotion_recognition: "It is intended to be used for emotion recognition."
fact.annex3.critical_infrastructure: "It is a safety component in the management and operation of critical digital infrastructure, road traffic, or the supply of water, gas, heating or electricity."
fact.annex3.education: "It is used in education or vocational training."
fact.annex3.education_admission: "It determines access or admission, or assigns persons, to educational and vocational training institutions."
fact.annex3.education_learning_outcomes: "It evaluates learning outcomes, including when they steer the learning process."
fact.annex3.education_level_assessment: "It assesses the appropriate level of education a person will receive or be able to access."
fact.annex3.education_exam_monitoring: "It monitors and detects prohibited behaviour of students during tests."
fact.annex3.employment: "It is used in employment, workers' management or access to self-employment."
fact.annex3.employment_recruitment: "It is used for the recruitment or selection of persons: targeted job advertisements, analysing and filtering applications, evaluating candidates."
fact.annex3.employment_work_decisions: "It makes decisions affecting work relationships, promotion or termination, allocates tasks based on individual behaviour or personal traits, or monitors and evaluates performance and behaviour."
fact.annex3.essential_services: "It is used for access to essential private services or essential public services and benefits."
fact.annex3.essential_public_benefits: "It is used by or on behalf of public authorities to evaluate eligibility for essential public assistance benefits and services, or to grant, reduce, revoke or reclaim them."
fact.annex3.essential_creditworthiness: "It evaluates the creditworthiness of natural persons or establishes their credit score (not for detecting financial fraud)."
fact.annex3.essential_insurance_pricing: "It is used for risk assessment and pricing in relation to natural persons for life and health insurance."
fact.annex3.essential_emergency_dispatch: "It evaluates and classifies emergency calls, dispatches or prioritises emergency first response services, or triages emergency healthcare patients."
fact.annex3.law_enforcement: "It is used by or on behalf of law enforcement authorities."
fact.annex3.law_enforcement_victim_risk: "It assesses the risk of a natural person becoming the victim of criminal offences."
fact.annex3.law_enforcement_polygraph: "It is used as a polygraph or similar tool."
fact.annex3.law_enforcement_evidence_reliability: "It evaluates the reliability of evidence in the investigation or prosecution of criminal offences."
fact.annex3.law_enforcement_offending_risk: "It assesses the risk of a person offending or re-offending not solely on the basis of profiling, or assesses personality traits or past criminal behaviour."
fact.annex3.law_enforcement_profiling: "It is used for the profiling of natural persons in the detection, investigation or prosecution of criminal offences."
fact.annex3.migration: "It is used in migration, asylum or border control management by or on behalf of competent public authorities."
fact.annex3.migration_polygraph: "It is used as a polygraph or similar tool."
fact.annex3.migration_risk_assessment: "It assesses a risk (security, irregular migration, health) posed by a person who intends to enter or has entered a Member State."
fact.annex3.migration_application_examination: "It assists in the examination of applications for asylum, visa or residence permits and associated complaints."
fact.annex3.migration_identification: "It detects, recognises or identifies natural persons in that context (not the verification of travel documents)."
fact.annex3.justice: "It is used in the administration of justice or in democratic processes."
fact.annex3.justice_judicial_assistance: "It assists a judicial authority in researching and interpreting facts and the law and applying the law to facts, or is used similarly in alternative dispute resolution."
fact.annex3.justice_election_influence: "It is used to influence the outcome of an election or referendum or the voting behaviour of persons (not tools to which persons are not directly exposed, such as campaign logistics)."
fact.high_risk.derogation_claimed: "The provider has concluded that the system is not high-risk under Article 6(3), because it does not pose a significant risk of harm."
fact.high_risk.profiling_natural_persons: "The system performs profiling of natural persons."
fact.high_risk.derogation_assessment_ref: "Reference to the provider's documented assessment (a document identifier or location)."
fact.transparency.interacts_with_persons: "It is intended to interact directly with natural persons."
fact.transparency.generates_synthetic_content: "It generates synthetic audio, image, video or text content."
fact.transparency.emotion_or_biometric_categorisation: "It is an emotion recognition system or a biometric categorisation system."
fact.transparency.deep_fake: "It generates or manipulates image, audio or video content constituting a deep fake."
fact.transparency.public_interest_text: "It generates or manipulates text published to inform the public on matters of public interest."
fact.transparency.editorial_control: "That text undergoes human review or editorial control, and a person holds editorial responsibility for its publication."
fact.deployer.public_authority: "The organisation is a public authority or a Union institution, body, office or agency."
fact.deployer.public_law_body_or_public_service: "The organisation is a body governed by public law or a private entity providing public services."
fact.deployer.employer_uses_at_workplace: "The organisation is an employer and uses the system at the workplace."

# AI Act rule pack: outcomes and obligations.
aia.art3_not_an_ai_system: "Not an AI system within the meaning of Article 3(1): the Regulation does not apply."
aia.art2_1_no_union_nexus: "The organisation is not in the Union and the output is not used in the Union: outside the scope of Article 2(1)."
aia.art2_3_military: "Used exclusively for military, defence or national security purposes: excluded by Article 2(3)."
aia.art2_6_research: "Developed and put into service for the sole purpose of scientific research and development: excluded by Article 2(6)."
aia.art2_8_pre_market: "Research, testing or development before being placed on the market or put into service: excluded by Article 2(8)."
aia.art2_10_personal_use: "Used by a natural person in a purely personal, non-professional activity: deployer obligations do not apply (Article 2(10))."
aia.art4_ai_literacy: "Take measures to support the development of AI literacy of staff and other persons operating and using the system on the organisation's behalf."
aia.art5_1a_manipulation: "Prohibited practice: subliminal, manipulative or deceptive techniques causing significant harm."
aia.art5_1b_vulnerabilities: "Prohibited practice: exploitation of vulnerabilities due to age, disability or social or economic situation."
aia.art5_1ba_intimate_content: "Prohibited practice: generating or manipulating intimate or sexually explicit material of an identifiable person without consent."
aia.art5_1bb_csam: "Prohibited practice: generating or manipulating child sexual abuse material."
aia.art5_1c_social_scoring: "Prohibited practice: social scoring leading to detrimental or disproportionate treatment."
aia.art5_1d_crime_prediction: "Prohibited practice: predicting the risk of a person committing a criminal offence based solely on profiling or personality traits."
aia.art5_1e_facial_scraping: "Prohibited practice: facial recognition databases built by untargeted scraping."
aia.art5_1f_emotion_inference: "Prohibited practice: inferring emotions in the workplace or in education institutions, outside medical or safety reasons."
aia.art5_1g_biometric_categorisation: "Prohibited practice: biometric categorisation to deduce sensitive characteristics."
aia.art5_1h_realtime_rbi: "Prohibited practice: 'real-time' remote biometric identification in publicly accessible spaces for law enforcement, outside the listed objectives."
aia.art6_1_annex1_product: "High-risk: safety component of a product covered by Annex I that requires a third-party conformity assessment."
aia.art6_3_derogation: "Treated as not high-risk under the Article 6(3) derogation, as claimed by the provider. Keep the provider's documented assessment; the provider registers the system (Article 49(2))."
aia.art50_1_interaction: "Persons interacting with the system are informed that they are interacting with an AI system, unless this is obvious."
aia.art50_2_synthetic_content: "Outputs are marked in a machine-readable format and detectable as artificially generated or manipulated. Systems placed on the market before 2 August 2026 have until 2 December 2026."
aia.art50_3_emotion_biometric: "Inform the natural persons exposed to an emotion recognition or biometric categorisation system of its operation."
aia.art50_4_deep_fake: "Disclose that deep fake content has been artificially generated or manipulated."
aia.art50_4_public_interest_text: "Disclose that text published to inform the public on matters of public interest has been artificially generated or manipulated."
aia.annex3_1a_remote_biometric_id: "High-risk: remote biometric identification (Annex III(1)(a))."
aia.annex3_1b_biometric_categorisation: "High-risk: biometric categorisation by sensitive attributes (Annex III(1)(b))."
aia.annex3_1c_emotion_recognition: "High-risk: emotion recognition (Annex III(1)(c))."
aia.annex3_2_critical_infrastructure: "High-risk: safety component of critical infrastructure (Annex III(2))."
aia.annex3_3a_education_admission: "High-risk: access or admission to education and vocational training (Annex III(3)(a))."
aia.annex3_3b_learning_outcomes: "High-risk: evaluation of learning outcomes (Annex III(3)(b))."
aia.annex3_3c_education_level: "High-risk: assessment of the appropriate level of education (Annex III(3)(c))."
aia.annex3_3d_exam_monitoring: "High-risk: monitoring of students during tests (Annex III(3)(d))."
aia.annex3_4a_recruitment: "High-risk: recruitment or selection of persons (Annex III(4)(a))."
aia.annex3_4b_work_decisions: "High-risk: decisions on work relationships, task allocation, monitoring and evaluation of workers (Annex III(4)(b))."
aia.annex3_5a_public_benefits: "High-risk: eligibility for essential public assistance benefits and services (Annex III(5)(a))."
aia.annex3_5b_creditworthiness: "High-risk: creditworthiness or credit scoring of natural persons (Annex III(5)(b))."
aia.annex3_5c_insurance_pricing: "High-risk: risk assessment and pricing for life and health insurance (Annex III(5)(c))."
aia.annex3_5d_emergency_dispatch: "High-risk: emergency calls, dispatch and triage (Annex III(5)(d))."
aia.annex3_6a_victim_risk: "High-risk: risk of becoming a victim of criminal offences (Annex III(6)(a))."
aia.annex3_6b_polygraph: "High-risk: polygraphs and similar tools in law enforcement (Annex III(6)(b))."
aia.annex3_6c_evidence_reliability: "High-risk: reliability of evidence (Annex III(6)(c))."
aia.annex3_6d_offending_risk: "High-risk: risk of offending or re-offending (Annex III(6)(d))."
aia.annex3_6e_profiling: "High-risk: profiling in the detection, investigation or prosecution of offences (Annex III(6)(e))."
aia.annex3_7a_polygraph: "High-risk: polygraphs and similar tools in migration, asylum and border control (Annex III(7)(a))."
aia.annex3_7b_migration_risk: "High-risk: risk assessment of persons entering a Member State (Annex III(7)(b))."
aia.annex3_7c_application_examination: "High-risk: examination of asylum, visa and residence permit applications (Annex III(7)(c))."
aia.annex3_7d_identification: "High-risk: detecting, recognising or identifying persons in migration and border control (Annex III(7)(d))."
aia.annex3_8a_judicial_assistance: "High-risk: assistance to a judicial authority (Annex III(8)(a))."
aia.annex3_8b_election_influence: "High-risk: influencing elections, referenda or voting behaviour (Annex III(8)(b))."
aia.art26_1_instructions_for_use: "Take technical and organisational measures to use the system in accordance with its instructions for use."
aia.art26_2_human_oversight: "Assign human oversight to natural persons with the necessary competence, training, authority and support."
aia.art26_4_input_data: "Where the organisation controls the input data, ensure it is relevant and sufficiently representative for the intended purpose."
aia.art26_5_monitoring: "Monitor the operation of the system on the basis of the instructions for use; inform the provider and the authorities of risks and serious incidents, and suspend use where a risk arises."
aia.art26_6_logs: "Keep the logs automatically generated by the system, to the extent under the organisation's control, for at least six months unless other law provides otherwise."
aia.art26_7_inform_workers: "Before using the system at the workplace, inform workers' representatives and the affected workers."
aia.art26_8_registration: "Comply with the registration obligations of Article 49, and do not use a system that is not registered in the EU database."
aia.art26_9_dpia: "Where applicable, use the information provided by the provider to carry out the data protection impact assessment."
aia.art27_fundamental_rights_assessment: "Before deploying a high-risk system listed in Annex III, perform an assessment of its impact on fundamental rights."

# Scan rules: what a finding says.
scan.system_not_classified: "The system is declared and has not been classified."
scan.classification_undetermined: "The classification is undetermined: facts are missing that could change it."
scan.classification_not_reviewed: "The classification is indicative: nobody has confirmed or overridden it."
scan.prohibited_practice: "The system is classified as a prohibited practice and is not retired."
scan.derogation_without_assessment: "The Article 6(3) derogation is claimed and no reference to the provider's documented assessment is recorded."
scan.transparency_notice_not_attested: "A transparency obligation addressed to the deployer applies, and no notice to the persons concerned is attested."
scan.human_oversight_not_attested: "The system is high-risk and no assignment of human oversight is attested."
scan.undeclared_model_in_traffic: "Traffic of the system reached a model that its declaration does not list."
scan.personal_data_not_declared: "Detectors found personal data in prompts of a system that is not declared as processing personal data."
scan.retired_system_in_use: "The system is declared as retired and still sends traffic."
scan.system_without_owner: "No owner is named for the system."
scan.role_not_covered: "The organisation holds a role for this system whose obligations this version does not evaluate."
scan.unattributed_traffic: "Requests were made that are tied to no declared system and that nothing groups into a candidate."
scan.undeclared_system_candidate: "A project, or a group of an external source, makes requests that no declared system accounts for: it may be an AI system nobody declared."
scan.mcp_server_legacy_only: "An MCP server of the catalogue offers no protocol revision the proxy speaks: calls to it cannot be authorized or recorded."
scan.agent_not_governable: "An agent of the registry offers no binding the proxy speaks on the host of its card: calls to it cannot be authorized or recorded."
scan.agent_card_invalid: "The card of an agent names a trusted key and its signature does not verify: it was changed after signing, or signed by someone else."
scan.agent_card_not_verified: "The card of an agent is unsigned, or signed with a key that is not trusted: nothing shows who published it."
scan.target_without_system: "An MCP server or an agent of a catalogue belongs to no declared AI system."
scan.calls_not_granted: "Callers tried to use an MCP server or an agent that no grant allows them."
scan.unknown_target_in_traffic: "Calls named an MCP server or an agent that no catalogue holds."
discover.none: "No candidate: every request of the last {days} days belongs to a declared system."
discover.summary: "{count} candidate systems in the traffic of the last {days} days. Each is a proposal: nothing is declared until a person completes a declaration."
discover.ungrouped: "{count} more requests are tied to no declared system and cannot be grouped."
