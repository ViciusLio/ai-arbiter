# Price catalogue shipped with Arbiter (ADR-0030).
#
# It prices only the mock provider, with invented figures, so that the quickstart and
# the tests show costs. Arbiter does not ship the price lists of real providers: they
# change without notice, and a stale price presented as current would mislead.
#
# Enter the prices of your own deployments under `finops.prices` in arbiter.yaml. Prices
# are per million tokens and must be written as strings ("0.15"), never as numbers.

catalogue: default
version: "2026.10.0"
currency: USD
as_of: 2026-10-02
prices:
  - provider: mock
    model: mock-small
    input_per_million: "0.15"
    output_per_million: "0.60"
    cached_input_per_million: "0.075"
  - provider: mock
    model: mock-large
    input_per_million: "2.50"
    output_per_million: "10.00"
    cached_input_per_million: "1.25"
