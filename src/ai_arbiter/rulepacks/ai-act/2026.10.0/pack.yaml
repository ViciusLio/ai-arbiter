  - id: AIA-ART6-3-DEROGATION
    kind: classification
    roles: [provider, deployer]
    # Only for a system that falls under a point of Annex III: the derogation is not
    # asked about otherwise.
    when:
      all:
        - any:
          - { all: [{ fact: annex3.biometrics, eq: true }, { fact: annex3.biometrics_remote_identification, eq: true }] }
          - { all: [{ fact: annex3.biometrics, eq: true }, { fact: annex3.biometrics_categorisation, eq: true }] }
          - { all: [{ fact: annex3.biometrics, eq: true }, { fact: annex3.biometrics_emotion_recognition, eq: true }] }
          - { all: [{ fact: annex3.critical_infrastructure, eq: true }] }
          - { all: [{ fact: annex3.education, eq: true }, { fact: annex3.education_admission, eq: true }] }
          - { all: [{ fact: annex3.education, eq: true }, { fact: annex3.education_learning_outcomes, eq: true }] }
          - { all: [{ fact: annex3.education, eq: true }, { fact: annex3.education_level_assessment, eq: true }] }
          - { all: [{ fact: annex3.education, eq: true }, { fact: annex3.education_exam_monitoring, eq: true }] }
          - { all: [{ fact: annex3.employment, eq: true }, { fact: annex3.employment_recruitment, eq: true }] }
          - { all: [{ fact: annex3.employment, eq: true }, { fact: annex3.employment_work_decisions, eq: true }] }
          - { all: [{ fact: annex3.essential_services, eq: true }, { fact: annex3.essential_public_benefits, eq: true }] }
          - { all: [{ fact: annex3.essential_services, eq: true }, { fact: annex3.essential_creditworthiness, eq: true }] }
          - { all: [{ fact: annex3.essential_services, eq: true }, { fact: annex3.essential_insurance_pricing, eq: true }] }
          - { all: [{ fact: annex3.essential_services, eq: true }, { fact: annex3.essential_emergency_dispatch, eq: true }] }
          - { all: [{ fact: annex3.law_enforcement, eq: true }, { fact: annex3.law_enforcement_victim_risk, eq: true }] }
          - { all: [{ fact: annex3.law_enforcement, eq: true }, { fact: annex3.law_enforcement_polygraph, eq: true }] }
          - { all: [{ fact: annex3.law_enforcement, eq: true }, { fact: annex3.law_enforcement_evidence_reliability, eq: true }] }
          - { all: [{ fact: annex3.law_enforcement, eq: true }, { fact: annex3.law_enforcement_offending_risk, eq: true }] }
          - { all: [{ fact: annex3.law_enforcement, eq: true }, { fact: annex3.law_enforcement_profiling, eq: true }] }
          - { all: [{ fact: annex3.migration, eq: true }, { fact: annex3.migration_polygraph, eq: true }] }
          - { all: [{ fact: annex3.migration, eq: true }, { fact: annex3.migration_risk_assessment, eq: true }] }
          - { all: [{ fact: annex3.migration, eq: true }, { fact: annex3.migration_application_examination, eq: true }] }
          - { all: [{ fact: annex3.migration, eq: true }, { fact: annex3.migration_identification, eq: true }] }
          - { all: [{ fact: annex3.justice, eq: true }, { fact: annex3.justice_judicial_assistance, eq: true }] }
          - { all: [{ fact: annex3.justice, eq: true }, { fact: annex3.justice_election_influence, eq: true }] }
        - { fact: high_risk.derogation_claimed, eq: true }
        - { fact: high_risk.profiling_natural_persons, eq: false }
    then:
      outcome: obligation
      legal_refs: [{ article: "6(3)" }, { article: "6(4)" }, { article: "49(2)" }]
      applies_from: 2027-12-02
      message_key: aia.art6_3_derogation

