    kind: classification
    roles: [provider, deployer]
    when: { fact: scope.is_ai_system, eq: true }
    then:
      outcome: obligation
      legal_refs: [{ article: "4" }]
      applies_from: 2025-02-02
      message_key: aia.art4_ai_literacy

