rules:
  - id: AIA-ART3-NOT-AN-AI-SYSTEM
    kind: classification
    when: { fact: scope.is_ai_system, eq: false }
    then:
      outcome: out_of_scope
      legal_refs: [{ article: "3(1)" }]
      message_key: aia.art3_not_an_ai_system

  - id: AIA-ART2-1-NO-UNION-NEXUS
    kind: classification
    when: { fact: scope.union_nexus, eq: false }
    then:
      outcome: out_of_scope
      legal_refs: [{ article: "2(1)" }]
      message_key: aia.art2_1_no_union_nexus

  - id: AIA-ART2-3-MILITARY
    kind: classification
    when: { fact: scope.military_defence_national_security, eq: true }
    then:
      outcome: out_of_scope
      legal_refs: [{ article: "2(3)" }]
      message_key: aia.art2_3_military

  - id: AIA-ART2-6-RESEARCH
