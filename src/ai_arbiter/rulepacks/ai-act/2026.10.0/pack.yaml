# AI Act rule pack: indicative classification of AI systems under Regulation (EU)
# 2024/1689 as amended by Regulation (EU) 2026/1744.
#
# This pack is data: conditions compare declared facts with the values written here,
# and nothing is executed (ADR-0012). It supports a classification that a person must
# review (ADR-0037). It is not legal advice and it does not replace the Regulation.
#
# What it covers: scope and exclusions (Art. 2 and 3), prohibited practices (Art. 5),
# high-risk classification (Art. 6, Annex I by declaration, Annex III point by point),
# the Art. 6(3) derogation as claimed by the provider (ADR-0036), transparency
# obligations (Art. 50), AI literacy (Art. 4) and the obligations of deployers of
# high-risk systems (Art. 26 and 27).
#
# What it does not cover: obligations of providers, importers and distributors beyond
# Art. 50; general-purpose AI models (Chapter V); the exclusions of Art. 2(4) and 2(12);
# Commission guidelines, harmonised standards and national law.
#
# Every rule names the provision it comes from and the date it applies from. The
# texts it was written from are listed under `regulation.sources` (ADR-0034).

