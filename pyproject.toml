[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-arbiter"
version = "0.1.0a1"
description = "Arbiter: an AI governance gateway and EU AI Act compliance toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ViciusLio" }]
keywords = ["ai-governance", "ai-act", "compliance", "llm-gateway", "finops", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
# Base install: core + compliance toolkit + CLI on SQLite. No web framework, no cloud SDK
# (ADR-0010).
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "babel>=2.16",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "typer>=0.15",
]

[project.urls]
Repository = "https://github.com/ViciusLio/ai-arbiter"
Documentation = "https://github.com/ViciusLio/ai-arbiter/tree/main/docs"
Changelog = "https://github.com/ViciusLio/ai-arbiter/blob/main/CHANGELOG.md"
Issues = "https://github.com/ViciusLio/ai-arbiter/issues"

[project.optional-dependencies]
gateway = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn>=0.32",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-sdk>=1.28",
]
# The messages and constants of the Model Context Protocol, for the MCP proxy (ADR-0050).
mcp = [
    "mcp-types>=2.2,<3",
]
# The Agent2Agent protocol through its official SDK, with what verifying the signature of
# an Agent Card needs (ADR-0052, ADR-0053).
a2a = [
    "a2a-sdk[signing]>=1.2,<2",
    "cryptography>=43",
]
# Detection of personal data written in words, run locally (ADR-0055). The language
# models are installed separately: see docs/gateway.md.
pii = [
    "presidio-analyzer>=2.2,<3",
]
# Reports as PDF (ADR-0057). WeasyPrint also needs the Pango library of the operating
# system: see docs/compliance.md.
pdf = [
    "weasyprint>=70,<71",
]
all = ["ai-arbiter[a2a,gateway,mcp,otel,pdf,pii]"]

[project.scripts]
arbiter = "ai_arbiter.cli.main:app"
ai-arbiter = "ai_arbiter.cli.main:app"

# Plugins are discovered through entry points and activated only by configuration
# (ADR-0011). Built-in implementations are registered the same way as third-party ones.
[project.entry-points."ai_arbiter.secret_stores"]
env = "ai_arbiter.adapters.local.secrets:EnvSecretStore"

[project.entry-points."ai_arbiter.event_buses"]
in_process = "ai_arbiter.core.events.bus:InProcessEventBus"

[project.entry-points."ai_arbiter.llm_providers"]
mock = "ai_arbiter.adapters.mock.provider:MockProvider"
openai_compat = "ai_arbiter.adapters.openai_compat.provider:OpenAICompatProvider"
azure_openai = "ai_arbiter.adapters.azure.openai:AzureOpenAIProvider"

[project.entry-points."ai_arbiter.pii_detectors"]
builtin = "ai_arbiter.core.redaction.builtin:BuiltinDetector"
presidio = "ai_arbiter.adapters.presidio.detector:PresidioDetector"

[project.entry-points."ai_arbiter.telemetry_sources"]
jsonl = "ai_arbiter.compliance.ingest.sources:JsonlSource"
litellm = "ai_arbiter.compliance.ingest.sources:LiteLLMSource"

[project.entry-points."ai_arbiter.agent_card_readers"]
a2a = "ai_arbiter.adapters.a2a.cards:SdkAgentCardReader"

[project.entry-points."ai_arbiter.notifiers"]
file = "ai_arbiter.adapters.local.notifiers:FileNotifier"
smtp = "ai_arbiter.adapters.local.notifiers:SmtpNotifier"

[dependency-groups]
# The language models the semantic detector of personal data is measured with
# (ADR-0055). They are not on PyPI, so they cannot be part of an extra: an operator
# installs the ones for their languages. This group is for development and CI.
pii-models = [
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "it-core-news-md @ https://github.com/explosion/spacy-models/releases/download/it_core_news_md-3.8.0/it_core_news_md-3.8.0-py3-none-any.whl",
]
dev = [
    "import-linter>=2.1",
    "mcp>=2.2,<3",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "rfc8785>=0.1.4",
    "ruff>=0.8",
    "types-protobuf>=7.35.1.20260906",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_arbiter"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/alembic.ini"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",     # builtins shadowing
    "ASYNC", # async pitfalls
    "B",     # bugbear
    "C4",    # comprehensions
    "DTZ",   # naive datetimes
    "E",
    "F",
    "I",     # import order
    "N",     # naming
    "PT",    # pytest style
    "PTH",   # pathlib
    "RUF",
    "S",     # security (bandit rule set)
    "SIM",
    "T20",   # no print
    "TID",   # tidy imports
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/ai_arbiter/migrations/versions/*" = ["N999"]
# A table of sentences in two languages: a sentence is one line, however long.
"scripts/build_presentation_en.py" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
# A directory, not a package name: Alembic loads migrations/env.py under another module
# name, and matching by path is what gets it measured.
source = ["src/ai_arbiter"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

# Module boundaries of ADR-0010. `lint-imports` runs in CI.
[tool.importlinter]
root_package = "ai_arbiter"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is the shared kernel and depends on no other Arbiter package"
type = "forbidden"
source_modules = ["ai_arbiter.core"]
forbidden_modules = [
    "ai_arbiter.adapters",
    "ai_arbiter.cli",
    "ai_arbiter.compliance",
    "ai_arbiter.gateway",
    "ai_arbiter.migrations",
]

[[tool.importlinter.contracts]]
name = "gateway and compliance never import each other"
type = "independence"
modules = ["ai_arbiter.gateway", "ai_arbiter.compliance"]
# The HTTP application is a composition root: it serves both halves (architecture
# overview, section 2). Nothing else in the gateway may import the compliance toolkit.
ignore_imports = ["ai_arbiter.gateway.api.** -> ai_arbiter.compliance.**"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "adapters are wired only at the composition roots"
type = "forbidden"
source_modules = ["ai_arbiter.core", "ai_arbiter.compliance", "ai_arbiter.gateway"]
forbidden_modules = ["ai_arbiter.adapters"]
ignore_imports = ["ai_arbiter.gateway.api.** -> ai_arbiter.adapters.**"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "the web framework is imported only by gateway.api"
type = "forbidden"
source_modules = [
    "ai_arbiter.adapters",
    "ai_arbiter.cli",
    "ai_arbiter.compliance",
    "ai_arbiter.core",
    "ai_arbiter.gateway",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]
ignore_imports = [
    "ai_arbiter.gateway.api.** -> fastapi",
    "ai_arbiter.gateway.api.** -> starlette",
    "ai_arbiter.cli.serve -> uvicorn",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
